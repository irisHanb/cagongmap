name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # build는 `/`와 `/cafes`를 prerender하면서 places를 읽는다. 더미 값으로는
      # fetch failed로 멈추므로 실제 anon 자격증명이 필요하다. 값은 전부
      # NEXT_PUBLIC_(브라우저로 나가는 공개 값)이고, 저장소가 public이라
      # 파일로 커밋하지 않고 시크릿에서 받는다.
      - name: .env.local 생성
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_KAKAO_MAP_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}
          EOF

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
